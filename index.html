<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Racing</title>
<style>
:root{--bg:#e9fbff;--ink:#06435c;--card:#fff;--accent:#0a8fc4}
@media (prefers-color-scheme:dark){:root{--bg:#06222e;--ink:#d9f4ff;--card:#0c3547;--accent:#4cc9f5}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.screen.on{display:flex}
h1{margin:0;font-size:2.2rem}
input,button{font:inherit;padding:12px 16px;border-radius:10px;border:2px solid var(--accent)}
input{background:var(--card);color:var(--ink);text-align:center;text-transform:uppercase}
button{background:var(--accent);color:#fff;cursor:pointer;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.themes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.err{color:#d33;min-height:1.2em}
#race{padding:0;justify-content:flex-start;gap:0}
#bar{display:flex;gap:10px;align-items:center;padding:8px;width:100%;justify-content:center;background:var(--card)}
#cv{display:block;width:100%;max-width:calc((100vh - 120px)*2);aspect-ratio:2/1;height:auto;margin:0 auto}
#res{min-height:2.4em;padding:8px;font-weight:700}
#fin{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff}
#fin.on{display:flex}
#fin .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#1e7be8,#0a1f5c 60%,#050d2e);animation:hue 8s linear infinite}
#fin .rays{position:absolute;left:50%;top:42%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 10deg,transparent 10deg 20deg);animation:spin 24s linear infinite}
#conf{position:absolute;inset:0;z-index:3;pointer-events:none}
.ft{position:relative;z-index:2;font-size:clamp(1.8rem,6vw,4rem);font-weight:900;letter-spacing:2px;text-align:center;text-shadow:0 0 20px #ffd84d,0 0 45px #ff9d00;animation:pulse 1s ease-in-out infinite alternate}
#pod{position:relative;z-index:2;display:flex;align-items:flex-end;gap:clamp(8px,2vw,28px);margin:22px 0}
.card{width:clamp(105px,27vw,250px);background:linear-gradient(#fff,#c9f1ff);border-radius:18px;padding:8px 8px 12px;text-align:center;color:#06435c;opacity:0;border:5px solid #cd7f32;animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards}
.card canvas{width:100%;height:auto;display:block}
.card.p3{animation-delay:.3s}
.card.p2{animation-delay:1.2s;border-color:#c0c0c0;box-shadow:0 0 25px #dfe}
.card.p1{width:clamp(125px,33vw,310px);border-color:gold;animation:pop .7s cubic-bezier(.2,1.6,.4,1) 2.4s forwards,glow .9s ease-in-out 3.1s infinite alternate}
.med{font-size:clamp(1.6rem,5vw,2.8rem);animation:bob 1s ease-in-out infinite alternate}
.nm{font-size:clamp(1rem,3vw,1.9rem);font-weight:900}
.od{display:inline-block;margin:4px 0;padding:2px 12px;border-radius:99px;background:#06435c;color:#ffd84d;font-weight:800;font-size:clamp(.9rem,2.4vw,1.4rem)}
.pl{font-size:clamp(1.3rem,4vw,2.6rem);font-weight:900;color:#e0a800}
.p1 .pl{background:linear-gradient(90deg,#ffd84d,#fff,#ffd84d);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.5s linear infinite;-webkit-text-stroke:1px #b88400}
#fin{padding-bottom:110px}
#fmsg{position:relative;z-index:2;max-width:760px;padding:0 16px;text-align:center;font-size:clamp(1.05rem,3vw,1.7rem);font-weight:700;text-shadow:0 2px 8px #000;opacity:0;animation:fade .6s 3s forwards}
#next{position:absolute;z-index:4;bottom:18px;left:50%;transform:translateX(-50%);width:min(92vw,720px);padding:clamp(14px,3vh,26px);font-size:clamp(1.5rem,5vw,2.6rem);font-weight:900;letter-spacing:2px;color:#4a2f00;background:linear-gradient(#ffe680,#ffb400);border:4px solid #fff;border-radius:18px;opacity:0;animation:fade .6s 3.6s forwards,beat .8s ease-in-out 4.2s infinite alternate}
#next:disabled{cursor:wait}
@keyframes beat{to{box-shadow:0 0 40px 10px #ffd84d;transform:translateX(-50%) scale(1.03)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.07)}}
@keyframes pop{from{opacity:0;transform:translateY(90px) scale(.5)}to{opacity:1;transform:none}}
@keyframes glow{to{box-shadow:0 0 70px 18px gold}from{box-shadow:0 0 20px gold}}
@keyframes bob{to{transform:translateY(-8px) rotate(6deg)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<section id="gate" class="screen on">
  <h1>🦌 Virtual Racing</h1>
  <p>Enter your access code</p>
  <input id="code" placeholder="ACCESS CODE" autocomplete="off">
  <button id="go">Enter</button>
  <div class="err" id="err"></div>
</section>

<section id="menu" class="screen">
  <h1>Choose your race</h1>
  <div class="themes" id="themes"></div>
</section>

<section id="race" class="screen">
  <div id="bar">
    <button id="back">← Menu</button>
    <button id="start">Start race</button>
    <span id="title"></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="res"></div>
</section>

<div id="fin">
  <div class="bg"></div><div class="rays"></div><canvas id="conf"></canvas>
  <div class="ft" id="ftitle">🏁 RACE RESULT 🏁</div>
  <div id="pod"></div>
  <div id="fmsg"></div>
  <button id="next">NEXT RACE ▶</button>
</div>
<script>
/* ============ CONFIG ============ */
// Each theme is a set of runners. Add Halloween etc. by adding an entry here.
const THEMES = {
  christmas: {
    label: "🎄 Christmas Reindeer Race", sky: "#bff6ff", track: "#d3fbff", edge: "#4fdcff", finish: "#ffffff",
    runners: [
      {n:"Blizzard",c:"#8a5a35",c2:"#f3efe8"}, {n:"Starlight",c:"#8b4a22",c2:"#8b4a22"},
      {n:"Snowflake",c:"#6a5648",c2:"#6a5648"}, {n:"Twinkle",c:"#f4f6f6",c2:"#f4f6f6"},
      {n:"Cracker",c:"#e07a1f",c2:"#e07a1f"}, {n:"Jingles",c:"#2b211c",c2:"#d8d4cc"}
    ]
  },
  halloween: { label: "🎃 Halloween Race", soon: true }
};
// Odds ladder, favourite (top lane) to outsider (bottom lane).
const ODDS = [1, 2, 4, 6, 8, 10];          // shown as 1/1 ... 10/1
const EVENT_RACES = 5; let raceNo = 1;   // races per event
const CODES_URL = "codes.json";            // revoke a code by deleting its entry and pushing
const RECHECK_MS = 5 * 60 * 1000;          // re-validate code while the page stays open

/* ============ ACCESS CODE ============ */
const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
async function codeValid(code){
  try{
    const r = await fetch(CODES_URL + "?t=" + Date.now(), {cache:"no-store"});
    const list = (await r.json()).codes || [];
    const h = await sha(code.trim().toUpperCase());
    const hit = list.find(c => c.hash === h);
    if(!hit) return "That code isn't valid (or has been revoked).";
    if(hit.expires && new Date(hit.expires + "T23:59:59") < new Date()) return "That code has expired.";
    return "";
  }catch(e){ return "Couldn't check the code. Check your connection and try again."; }
}
async function enter(code){
  $("err").textContent = "Checking…";
  const bad = await codeValid(code);
  if(bad){ localStorage.removeItem("vr_code"); $("err").textContent = bad; show("gate"); return false; }
  localStorage.setItem("vr_code", code.trim().toUpperCase());
  $("err").textContent = ""; buildMenu(); show("menu"); return true;
}
$("go").onclick = () => enter($("code").value);
$("code").onkeydown = e => { if(e.key === "Enter") enter($("code").value); };
setInterval(async () => {                       // kick out revoked codes mid-session
  const c = localStorage.getItem("vr_code");
  if(c && !$("gate").classList.contains("on") && await codeValid(c)){ racing = false; localStorage.removeItem("vr_code"); show("gate"); $("err").textContent = "Your code is no longer valid."; }
}, RECHECK_MS);
const saved = localStorage.getItem("vr_code");
if(saved) enter(saved);

/* ============ MENU ============ */
function buildMenu(){
  $("themes").innerHTML = "";
  for(const [k,t] of Object.entries(THEMES)){
    const b = document.createElement("button");
    b.textContent = t.label + (t.soon ? " (coming soon)" : "");
    b.disabled = !!t.soon;
    b.onclick = () => openRace(k);
    $("themes").appendChild(b);
  }
}

/* ============ RACE ENGINE ============ */
const cv = $("cv"); let ctx = cv.getContext("2d"), noLabel = false;
const W = 1600, H = 800, TOP = 100, LANE = 104, TRACK_LEN = 7000, START_X = 200;   // logical size; canvas is rendered at screen resolution
let lastT = 0, snow = [], endT = 0;
let theme, field = [], racing = false, t0 = 0, camX = 0, finished = [];

function openRace(key){ theme = THEMES[key]; raceNo = 1; $("start").style.display = ""; $("start").textContent = "Start race 1 of " + EVENT_RACES; setTitle(); $("res").textContent = ""; setup(); show("race"); fit(); draw(0); }
$("back").onclick = () => { racing = false; show("menu"); };
$("start").onclick = () => { if(!racing) run(); };

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function setup(){
  // New race: shuffle who's favourite, then lane 0 = 1/1 ... lane 5 = 10/1
  field = shuffle([...theme.runners]).map((r,i) => ({...r, odds:ODDS[i], lane:i, pos:0, ph:Math.random()*6, over:0, mv:false, seed:Math.random()*6}));
  finished = []; camX = 0; snow = [];
}

// Draw finishing order using win-probability weights (1/(odds+1)), so 1/1 wins ~half the time, 10/1 ~1 in 11.
function drawOrder(){
  const pool = field.map(f => ({f, w:1/(f.odds+1)})), order = [];
  while(pool.length){
    const tot = pool.reduce((s,p) => s+p.w, 0); let x = Math.random()*tot, k = 0;
    while(k < pool.length-1 && (x -= pool[k].w) > 0) k++;
    order.push(pool.splice(k,1)[0].f);
  }
  return order;
}

function run(){
  $("start").style.display = "none"; setTitle();
  setup(); $("res").textContent = "";
  const order = drawOrder(), base = 17;           // seconds for the winner
  order.forEach((f,i) => {
    f.T = base + i*0.7 + Math.random()*0.35;      // set finish time so the drawn order is guaranteed
    f.a = [0.05+Math.random()*0.06, 0.04+Math.random()*0.05];
    f.p = [Math.random()*6.3, Math.random()*6.3]; f.last = 0;
  });
  endT = Math.max(...field.map(f => f.T)) + 1.5; lastT = 0;
  racing = true; t0 = performance.now(); $("start").disabled = true;
  requestAnimationFrame(tick);
}

function progress(f, t){                           // smooth wobble that always ends exactly at 1
  const u = Math.min(t/f.T, 1), env = u*(1-u);
  const v = u + env*(f.a[0]*Math.sin(2*Math.PI*2*u+f.p[0]) + f.a[1]*Math.sin(2*Math.PI*3.3*u+f.p[1]))*4;
  return Math.max(f.last, Math.min(v, 1));
}

function tick(now){
  if(!racing) return;
  const t = (now - t0)/1000, dt = Math.max(0, Math.min(t - lastT, .05)); lastT = t;
  field.forEach(f => {
    f.last = f.pos = progress(f, t);
    if(f.pos >= 1 && !f.done){ f.done = true; finished.push(f); }
    f.over = t > f.T ? 150*(1 - Math.exp(-(t - f.T)*1.8)) : 0;   // coast past the line
    f.mv = t < f.T + 1.3;
    if(f.mv){
      f.ph += dt*15*(t < f.T ? 1 : Math.max(0, 1 - (t - f.T)/1.3));
      if(Math.random() < dt*30) snow.push({x:START_X+f.pos*TRACK_LEN+f.over-20, y:TOP+f.lane*LANE+LANE/2+38+Math.random()*6, vx:-40-Math.random()*70, vy:-30-Math.random()*60, l:.6, r:2+Math.random()*3});
    }
  });
  snow.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 140*dt; p.l -= dt; });
  snow = snow.filter(p => p.l > 0);
  const lead = Math.max(...field.map(f => f.pos));
  camX = Math.max(0, Math.min(lead*TRACK_LEN - W*0.5, TRACK_LEN + START_X + 260 - W));
  draw(t);
  if(t < endT) return requestAnimationFrame(tick);
  racing = false; $("start").disabled = false;
  const w = finished[0]; setTimeout(showFinish, 900);
  $("res").textContent = `🏆 ${w.n} wins at ${w.odds}/1!  2nd: ${finished[1].n}  3rd: ${finished[2].n}`;
}

/* ============ FINISH SCREEN ============ */
function portrait(f){                       // reuse deer() to paint a close-up
  const c = document.createElement("canvas"); c.width = 420; c.height = 400;
  const real = ctx; ctx = c.getContext("2d"); noLabel = true;
  ctx.scale(2.3,2.3); deer({...f,mv:false,ph:0}, 72, 101, 0);
  ctx = real; noLabel = false; return c;
}
function showFinish(){
  const pod = $("pod"); pod.innerHTML = "";
  const last = raceNo >= EVENT_RACES;
  $("ftitle").textContent = last ? "🏁 FINAL RACE RESULT 🏁" : `🏁 RACE ${raceNo} OF ${EVENT_RACES} 🏁`;
  $("fmsg").textContent = last ? "That was the last race of the event! Update your sheets and pay your winnings." : "Update your sheets, pay your winnings and when you are ready start the next race.";
  const nb = $("next"); nb.textContent = last ? "FINISH EVENT" : "NEXT RACE ▶"; nb.disabled = true; setTimeout(() => nb.disabled = false, 3600);
  const meds = ["🥇","🥈","🥉"], pl = ["1st","2nd","3rd"];
  [1,0,2].forEach(i => {                    // podium layout: 2nd, 1st, 3rd
    const f = finished[i], d = document.createElement("div");
    d.className = "card p" + (i+1);
    d.innerHTML = `<div class="med">${meds[i]}</div>`;
    d.appendChild(portrait(f));
    d.insertAdjacentHTML("beforeend", `<div class="nm">${f.n}</div><div class="od">Odds ${f.odds}/1</div><div class="pl">${pl[i]}</div>`);
    pod.appendChild(d);
  });
  $("fin").classList.add("on"); startConf();
}
function closeFin(){ $("fin").classList.remove("on"); cancelAnimationFrame(confRaf); }
$("next").onclick = () => { closeFin(); if(raceNo >= EVENT_RACES){ show("menu"); return; } raceNo++; run(); };
function setTitle(){ $("title").textContent = `${theme.label} · Race ${raceNo} of ${EVENT_RACES}`; }
const fc = $("conf"), fg = fc.getContext("2d"); let bits = [], confRaf = 0;
function burst(n){
  for(let i=0;i<n;i++) bits.push({x:innerWidth/2+(Math.random()-.5)*Math.min(innerWidth,500),y:innerHeight*.5,vx:(Math.random()-.5)*20,vy:-Math.random()*20-4,s:6+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.4,h:Math.random()*360});
}
function startConf(){
  fc.width = innerWidth; fc.height = innerHeight; bits = [];
  burst(80); [[1300,120],[2500,260],[4000,140],[6000,120]].forEach(([ms,n]) => setTimeout(() => $("fin").classList.contains("on") && burst(n), ms));
  cancelAnimationFrame(confRaf); confLoop();
}
function confLoop(){
  fg.clearRect(0,0,fc.width,fc.height);
  bits.forEach(b => { b.x+=b.vx; b.y+=b.vy; b.vy+=.35; b.vx*=.99; b.r+=b.vr;
    fg.save(); fg.translate(b.x,b.y); fg.rotate(b.r); fg.fillStyle=`hsl(${b.h},90%,60%)`; fg.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); fg.restore(); });
  bits = bits.filter(b => b.y < fc.height+20);
  if($("fin").classList.contains("on")) confRaf = requestAnimationFrame(confLoop);
}

/* ============ DRAWING ============ */
function fit(){                              // render at the screen's real resolution
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(r.width*d); cv.height = Math.round(r.width*d/2);
}
addEventListener("resize", () => { if($("race").classList.contains("on")){ fit(); draw(lastT); } });
const hash = n => { const v = Math.sin(n*127.1)*43758.5453; return v - Math.floor(v); };
const sh = (h,k) => { const n = parseInt(h.slice(1),16); return `rgb(${(n>>16)*k|0},${(n>>8&255)*k|0},${(n&255)*k|0})`; };
function E(cx,cy,rx,ry,r,c){ ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,r,0,7); ctx.fill(); }

function tree(x,y,h){
  ctx.fillStyle = "#5a3a22"; ctx.fillRect(x-3,y-h*.15,6,h*.15);
  for(let i=0;i<3;i++){
    const w = h*(.5-i*.1), by = y-h*.12-i*h*.27;
    ctx.fillStyle = "#1f6b4a"; ctx.beginPath(); ctx.moveTo(x-w/2,by); ctx.lineTo(x,by-h*.38); ctx.lineTo(x+w/2,by); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(x-w*.22,by-h*.2); ctx.lineTo(x,by-h*.38); ctx.lineTo(x+w*.22,by-h*.2); ctx.quadraticCurveTo(x,by-h*.13,x-w*.22,by-h*.2); ctx.fill();
  }
}
function pole(x,y){ for(let i=0;i<5;i++){ ctx.fillStyle = i%2 ? "#fff" : "#d8232a"; ctx.fillRect(x-4,y-50+i*10,8,10); } E(x,y-52,4.5,3,0,"#d8232a"); }

function draw(t){
  const k = cv.width/W, bot = TOP+LANE*6+10;
  ctx.setTransform(k,0,0,k,0,0);
  let g = ctx.createLinearGradient(0,0,0,TOP+20); g.addColorStop(0,"#86c2ee"); g.addColorStop(1,"#e6f4ff");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#d3e8f8"; ctx.beginPath(); ctx.moveTo(0,TOP+10);            // distant hills
  for(let x=0;x<=W;x+=40) ctx.lineTo(x, TOP-30-22*Math.sin((x+camX*.15)/190));
  ctx.lineTo(W,TOP+10); ctx.fill();
  const base = Math.floor(camX*.35/110);                                          // parallax trees
  for(let i=-1;i<W/110+2;i++) tree(i*110-(camX*.35%110), TOP-6, 60+hash(i+base)*50);
  g = ctx.createLinearGradient(0,TOP-14,0,bot); g.addColorStop(0,"#e9f4ff"); g.addColorStop(1,"#fbfdff");
  ctx.fillStyle = g; ctx.fillRect(0,TOP-14,W,bot-TOP+14);                          // snow track
  for(let c=Math.floor(camX/90)-1;c<camX/90+W/90+1;c++) for(let r=0;r<6;r++){      // dimples + sparkles
    const h1 = hash(c*7+r*3.1), h2 = hash(c*3+r*9.7), px = c*90+h1*90-camX, py = TOP+(r+h2)*LANE;
    E(px,py,14+h1*26,3+h2*4,0,"rgba(150,185,222,.2)");
    ctx.globalAlpha = .4+.6*Math.abs(Math.sin(t*3+h1*20)); E(px+30,py-14,1.6,1.6,0,"#fff"); ctx.globalAlpha = 1;
    E(px+30,py-14,3,3,0,"rgba(190,225,255,.25)");
  }
  ctx.lineWidth = 3; ctx.setLineDash([22,16]); ctx.lineDashOffset = camX%38;       // ski-groove lane lines
  for(let i=1;i<6;i++){ const y = TOP+i*LANE;
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.beginPath(); ctx.moveTo(0,y+3); ctx.lineTo(W,y+3); ctx.stroke();
    ctx.strokeStyle = "rgba(120,165,210,.6)"; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(0,TOP-8);                    // top drift
  for(let x=0;x<=W;x+=30) ctx.lineTo(x, TOP-14-7*Math.sin((x+camX)/80)); ctx.lineTo(W,TOP-40); ctx.lineTo(0,TOP-40); ctx.fill();
  g = ctx.createLinearGradient(0,bot,0,H); g.addColorStop(0,"#fff"); g.addColorStop(1,"#a9cbe6");
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,bot);          // bottom bank
  for(let x=0;x<=W;x+=30) ctx.lineTo(x, bot+10+9*Math.sin((x+camX)/110)); ctx.lineTo(W,H); ctx.fill();
  for(let m=Math.floor(camX/400)*400;m<camX+W+400;m+=400){ pole(m-camX,TOP-12); pole(m-camX,bot+22); }
  ctx.fillStyle = "rgba(120,165,210,.5)"; ctx.fillRect(START_X-70-camX,TOP-10,5,LANE*6+20);   // start line
  const fx = START_X+TRACK_LEN+60-camX;                                                       // finish line
  for(let i=0;i<LANE*6/18;i++) for(let j=0;j<2;j++){ ctx.fillStyle = (i+j)%2 ? "#fff" : "#222"; ctx.fillRect(fx+j*18,TOP+i*18,18,18); }
  ctx.fillStyle = "#5a3a22"; ctx.fillRect(fx-6,TOP-110,8,100);
  ctx.fillStyle = "#d8232a"; ctx.beginPath(); ctx.roundRect(fx-80,TOP-118,170,38,8); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 26px system-ui"; ctx.textAlign = "center"; ctx.fillText("FINISH",fx+5,TOP-91); ctx.textAlign = "left";
  field.forEach(f => deer(f, START_X + f.pos*TRACK_LEN + f.over - camX, TOP + f.lane*LANE + LANE/2 - 12, t));
  snow.forEach(p => { ctx.globalAlpha = Math.min(1,p.l/.4); E(p.x-camX,p.y,p.r,p.r,0,"#fff"); ctx.strokeStyle = "rgba(150,190,230,.8)"; ctx.lineWidth = 1; ctx.stroke(); });
  ctx.globalAlpha = 1;
}

function deer(f,x,y,t){
  const mv = f.mv, ph = f.ph || 0, dk = sh(f.c,.7);
  ctx.save(); ctx.translate(x,y);
  if(!noLabel){
    ctx.font = "bold 22px system-ui"; const lab = `${f.n}  ${f.odds}/1`, lw = ctx.measureText(lab).width + 24;
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#0a8fc4"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(-lw-80,-40,lw,34,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#06435c"; ctx.fillText(lab,-lw-68,-16);
  }
  ctx.scale(1.1,1.1);
  E(0,58,48,6,0,"rgba(40,80,130,.22)");                                  // ground shadow
  ctx.translate(0, mv ? -Math.abs(Math.sin(ph))*6 : Math.sin(t*2+f.seed)*.7);   // gallop bounce
  ctx.rotate(mv ? Math.sin(ph)*.04 : 0);
  const leg = (hx,hy,p,c) => {                                           // two-joint gallop leg
    const a1 = mv ? Math.sin(p)*.8 : 0, a2 = mv ? a1 - .55*(1+Math.sin(p+1.3)) : 0;
    const kx = hx+Math.sin(a1)*22, ky = hy+Math.cos(a1)*22, fx = kx+Math.sin(a2)*21, fy = ky+Math.cos(a2)*21;
    ctx.lineCap = "round"; ctx.strokeStyle = c;
    ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(kx,ky); ctx.stroke();
    ctx.lineWidth = 6.5; ctx.beginPath(); ctx.moveTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
    E(fx+2,fy+1,5.5,3.5,0,"#2a1b12");
  };
  leg(14,14,ph+.6,dk); leg(-18,14,ph+3.2,dk);                            // far legs
  E(-41,-6,8,5,-.5+(mv ? Math.sin(ph)*.35 : 0),f.c2);                    // tail
  E(-22,0,19,20,0,f.c); E(0,2,26,21,0,f.c); E(22,0,18,21,0,f.c);        // body
  E(2,12,26,9,0,f.c2); E(0,-10,24,7,0,"rgba(255,255,255,.14)");
  ctx.strokeStyle = "#5b3a22"; ctx.lineWidth = 4; ctx.beginPath();      // harness
  ctx.moveTo(14,-20); ctx.quadraticCurveTo(25,0,16,22); ctx.moveTo(-8,-20); ctx.quadraticCurveTo(-4,0,-10,21); ctx.moveTo(14,-20); ctx.lineTo(-8,-20); ctx.stroke();
  E(22,6,4.5,4.5,0,"#6fe9ee"); E(-6,2,4,4,0,"#6fe9ee");
  leg(24,14,ph,f.c); leg(-28,14,ph+2.6,f.c);                             // near legs
  ctx.strokeStyle = f.c; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(26,-6); ctx.lineTo(50,-30); ctx.stroke();   // neck
  E(38,-12,8,12,.7,f.c2); E(41,-18,4.5,4.5,0,"#ffd24d");
  ctx.translate(0, mv ? Math.sin(ph*2+1)*2.5 : Math.sin(t*1.5+f.seed));  // head bob
  const fl = mv ? Math.sin(ph*2)*.15 : 0;
  ctx.save(); ctx.translate(55,-46); ctx.rotate(mv ? Math.sin(ph*2)*.07 : 0);   // antlers sway
  [[-5,"#a8997a",3.2],[2,"#ecdcb2",3.8]].forEach(([dx,c,w]) => {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
    ctx.moveTo(dx,0); ctx.quadraticCurveTo(dx-10,-18,dx-2,-38);
    ctx.moveTo(dx-6,-15); ctx.lineTo(dx+7,-25); ctx.moveTo(dx-8,-25); ctx.lineTo(dx-17,-36);
    ctx.moveTo(dx-2,-38); ctx.lineTo(dx+8,-47); ctx.moveTo(dx-2,-38); ctx.lineTo(dx-8,-49); ctx.stroke();
  });
  ctx.restore();
  E(49,-47,3.6,8,-.8+fl,dk);                                             // far ear
  E(58,-36,13,10.5,.3,f.c); E(70,-31,9,7,.35,f.c); E(71,-30,6,4.5,.35,"rgba(255,255,255,.2)");
  E(77,-30,3.6,3,0,"#2b1a14");                                           // nose
  E(59,-39,4.3,4.8,0,"#fff"); E(60.5,-39,2.5,3,0,"#111"); E(61.3,-40.2,.9,.9,0,"#fff");   // eye
  E(53,-46,4,9,-.6+fl,f.c); E(53.5,-46,2,6,-.6+fl,"#f0a8a0");           // near ear
  ctx.restore();
}
