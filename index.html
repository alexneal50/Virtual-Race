<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Racing</title>
<style>
:root{--bg:#e9fbff;--ink:#06435c;--card:#fff;--accent:#0a8fc4}
@media (prefers-color-scheme:dark){:root{--bg:#06222e;--ink:#d9f4ff;--card:#0c3547;--accent:#4cc9f5}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.screen.on{display:flex}
h1{margin:0;font-size:2.2rem}
input,button{font:inherit;padding:12px 16px;border-radius:10px;border:2px solid var(--accent)}
input{background:var(--card);color:var(--ink);text-align:center;text-transform:uppercase}
button{background:var(--accent);color:#fff;cursor:pointer;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.themes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.err{color:#d33;min-height:1.2em}
#race{padding:0;justify-content:flex-start;gap:0}
#bar{display:flex;gap:10px;align-items:center;padding:8px;width:100%;justify-content:center;background:var(--card)}
#cv{display:block;width:100%;max-width:calc((100vh - 120px)*2);aspect-ratio:2/1;height:auto;margin:0 auto}
#res{min-height:2.4em;padding:8px;font-weight:700}
#fin{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff}
#fin.on{display:flex}
#fin .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#1e7be8,#0a1f5c 60%,#050d2e);animation:hue 8s linear infinite}
#fin .rays{position:absolute;left:50%;top:42%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 10deg,transparent 10deg 20deg);animation:spin 24s linear infinite}
#conf{position:absolute;inset:0;z-index:3;pointer-events:none}
.ft{position:relative;z-index:2;font-size:clamp(1.8rem,6vw,4rem);font-weight:900;letter-spacing:2px;text-align:center;text-shadow:0 0 20px #ffd84d,0 0 45px #ff9d00;animation:pulse 1s ease-in-out infinite alternate}
#pod{position:relative;z-index:2;display:flex;align-items:flex-end;gap:clamp(8px,1.6vw,22px);margin:16px 0 0}
.card{width:clamp(90px,16vw,200px);background:linear-gradient(#fff,#c9f1ff);border-radius:18px;padding:8px 8px 12px;text-align:center;color:#06435c;opacity:0;border:5px solid #cd7f32;animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards}
.card canvas{width:100%;height:auto;display:block}
.card.p3{animation-delay:.3s}
.card.p2{animation-delay:1.2s;border-color:#c0c0c0;box-shadow:0 0 25px #dfe}
.card.p1{width:clamp(110px,20vw,250px);border-color:gold;animation:pop .7s cubic-bezier(.2,1.6,.4,1) 2.4s forwards,glow .9s ease-in-out 3.1s infinite alternate}
.med{font-size:clamp(1.3rem,3.2vw,2.2rem);animation:bob 1s ease-in-out infinite alternate}
.nm{font-size:clamp(.9rem,2.1vw,1.5rem);font-weight:900}
.od{display:inline-block;margin:4px 0;padding:2px 12px;border-radius:99px;background:#06435c;color:#ffd84d;font-weight:800;font-size:clamp(.8rem,1.7vw,1.15rem)}
.pl{font-size:clamp(1.1rem,3vw,2rem);font-weight:900;color:#e0a800}
.p1 .pl{background:linear-gradient(90deg,#ffd84d,#fff,#ffd84d);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.5s linear infinite;-webkit-text-stroke:1px #b88400}
#fin{padding-bottom:110px}
#fmsg{position:relative;z-index:2;max-width:900px;margin-top:10px;padding:0 16px;text-align:center;font-size:clamp(1.1rem,2.6vw,1.9rem);font-weight:800;text-shadow:0 2px 8px #000;opacity:0;animation:fade .6s .4s forwards}
#next{position:absolute;z-index:4;bottom:18px;left:50%;transform:translateX(-50%);width:min(92vw,720px);padding:clamp(14px,3vh,26px);font-size:clamp(1.5rem,5vw,2.6rem);font-weight:900;letter-spacing:2px;color:#4a2f00;background:linear-gradient(#ffe680,#ffb400);border:4px solid #fff;border-radius:18px;opacity:0;animation:fade .6s 3.6s forwards,beat .8s ease-in-out 4.2s infinite alternate}
#next:disabled{cursor:wait}
@keyframes beat{to{box-shadow:0 0 40px 10px #ffd84d;transform:translateX(-50%) scale(1.03)}}
#fin.hw .bg{background:radial-gradient(circle at 50% 40%,#8a2be2,#2a0a4a 58%,#08020f);animation:none}
#fin.hw .rays{background:repeating-conic-gradient(rgba(255,150,40,.17) 0 10deg,transparent 10deg 20deg)}
#fin.hw .ft{text-shadow:0 0 20px #ff7a00,0 0 45px #ff4d00}
#fin.hw .card{background:linear-gradient(#fff6e6,#ffd7a1)}
#fin.farm .bg{background:radial-gradient(circle at 50% 40%,#ff9ec0,#7a3b2a 55%,#25401a);animation:none}
#fin.farm .rays{background:repeating-conic-gradient(rgba(255,230,120,.17) 0 10deg,transparent 10deg 20deg)}
#fin.farm .ft{text-shadow:0 0 20px #ff6fa3,0 0 45px #ffb347}
#fin.farm .card{background:linear-gradient(#fffaf0,#ffe0c4)}
#fnote{position:relative;z-index:2;margin-top:12px;max-width:900px;padding:0 16px;text-align:center;font-weight:800;font-size:clamp(.95rem,2vw,1.4rem);text-shadow:0 2px 8px #000;opacity:0;animation:fade .6s 2.8s forwards}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.07)}}
@keyframes pop{from{opacity:0;transform:translateY(90px) scale(.5)}to{opacity:1;transform:none}}
@keyframes glow{to{box-shadow:0 0 70px 18px gold}from{box-shadow:0 0 20px gold}}
@keyframes bob{to{transform:translateY(-8px) rotate(6deg)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<section id="gate" class="screen on">
  <h1>🦌 Virtual Racing</h1>
  <p>Enter your access code</p>
  <input id="code" placeholder="ACCESS CODE" autocomplete="off">
  <button id="go">Enter</button>
  <div class="err" id="err"></div>
</section>

<section id="menu" class="screen">
  <h1>Choose your race</h1>
  <div class="themes" id="themes"></div>
</section>

<section id="race" class="screen">
  <div id="bar">
    <button id="back">← Menu</button>
    <button id="start">Start race</button>
    <span id="title"></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="res"></div>
</section>

<div id="fin">
  <div class="bg"></div><div class="rays"></div><canvas id="conf"></canvas>
  <div class="ft" id="ftitle">🏁 RACE RESULT 🏁</div>
  <div id="fmsg"></div>
  <div id="pod"></div>
  <div id="fnote"></div>
  <button id="next">NEXT RACE ▶</button>
</div>
<script>
/* ============ CONFIG ============ */
// Each theme is a set of runners. Add Halloween etc. by adding an entry here.
const THEMES = {
  christmas: {
    label: "🎄 Christmas Reindeer Race", scene: sceneSnow, post: pole, obst: obstSnow, jumpName: "snow bank", waterName: "ice river", puff: ["#fff","rgba(150,190,230,.8)"],
    runners: [
      {n:"Blizzard",c:"#8a5a35",c2:"#f3efe8",s1:"#f58a1f",s2:"#ffd21f",ant:0,sz:1,bell:"#5ec8d0",stripe:true}, {n:"Starlight",c:"#8b4a22",c2:"#8b4a22",s1:"#d8232a",s2:"#ffffff",ant:1,sz:1.03,bell:"#ffd24d",star:true},
      {n:"Snowflake",c:"#6a5648",c2:"#f1f4f6",s1:"#2a6fd6",s2:"#ffffff",ant:2,sz:.94,bell:"#9fd8ff",sock:true,flake:true}, {n:"Twinkle",c:"#f4f6f6",c2:"#f4f6f6",s1:"#8a3fd6",s2:"#ff8ad0",ant:3,sz:.97,bell:"#ff8ad0",sparkle:true},
      {n:"Cracker",c:"#e07a1f",c2:"#e07a1f",s1:"#1f9d55",s2:"#ffe14d",ant:4,sz:1.06,bell:"#6fe08a",spots:true}, {n:"Jingles",c:"#2b211c",c2:"#d8d4cc",s1:"#2a2a2a",s2:"#e0b020",ant:5,sz:1,bell:"#ffd24d",rn:true}
    ]
  },
  halloween: {
    label: "🎃 Halloween Monster Race", hw: true, scene: sceneGrave, post: postPumpkin, obst: obstGrave, jumpName: "gravestone", waterName: "swamp", runner: monster, acc: "#e8680c",
    puff: ["#7a6590","rgba(15,8,25,.55)"], hues: [22,38,280,110],
    runners: [{n:"Dracula",k:"dracula"},{n:"Frankenstein",k:"frank"},{n:"Mummy",k:"mummy"},{n:"Werewolf",k:"wolf"},{n:"Ghost",k:"ghost"},{n:"Skeleton",k:"skel"}]
  },
  pigs: {
    label: "🐷 Pig Race - Muddy Farmyard", cls: "farm", scene: sceneFarm, post: postFarm, obst: obstFarm, jumpName: "fence", waterName: "muddy puddle", runner: pig, acc: "#8b5a2b",
    puff: ["#6a4528","rgba(35,20,8,.6)"], hues: [335,25,50,110],
    runners: [
      {n:"Wilbur",k:"pig",m:"plain",c:"#f6a6b8",ring:"#2a6fd6"},
      {n:"Truffles",k:"pig",m:"spots",c:"#f4aab9",m1:"#2a2a30",ring:"#d32f2f"},
      {n:"Hamlet",k:"pig",m:"brown",c:"#f7efe6",m1:"#8b5a33",sn:"#e99aa8",ring:"#2e9d4f"},
      {n:"Pickles",k:"pig",m:"saddle",c:"#2d2a33",m1:"#f6ecef",sn:"#e0909f",ring:"#8a3fd6"},
      {n:"Snorty",k:"pig",m:"ginger",c:"#d9772e",sn:"#e8a07a",ring:"#e0b020"},
      {n:"Porkchop",k:"pig",m:"patch",c:"#f4b4c0",m1:"#2a2a30",ring:"#e83e8c"}
    ]
  }
};
// Odds ladder, favourite (top lane) to outsider (bottom lane).
const ODDS = [1, 2, 4, 6, 8, 10];          // shown as 1/1 ... 10/1
const EVENT_RACES = 5; let raceNo = 1;   // races per event
const CODES_URL = "codes.json";            // revoke a code by deleting its entry and pushing
const RECHECK_MS = 5 * 60 * 1000;          // re-validate code while the page stays open

/* ============ ACCESS CODE ============ */
const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
async function codeValid(code){
  try{
    const r = await fetch(CODES_URL + "?t=" + Date.now(), {cache:"no-store"});
    const list = (await r.json()).codes || [];
    const h = await sha(code.trim().toUpperCase());
    const hit = list.find(c => c.hash === h);
    if(!hit) return "That code isn't valid (or has been revoked).";
    if(hit.expires && new Date(hit.expires + "T23:59:59") < new Date()) return "That code has expired.";
    return "";
  }catch(e){ return "Couldn't check the code. Check your connection and try again."; }
}
async function enter(code){
  $("err").textContent = "Checking…";
  const bad = await codeValid(code);
  if(bad){ localStorage.removeItem("vr_code"); $("err").textContent = bad; show("gate"); return false; }
  localStorage.setItem("vr_code", code.trim().toUpperCase());
  $("err").textContent = ""; buildMenu(); show("menu"); return true;
}
$("go").onclick = () => enter($("code").value);
$("code").onkeydown = e => { if(e.key === "Enter") enter($("code").value); };
setInterval(async () => {                       // kick out revoked codes mid-session
  const c = localStorage.getItem("vr_code");
  if(c && !$("gate").classList.contains("on") && await codeValid(c)){ racing = false; localStorage.removeItem("vr_code"); show("gate"); $("err").textContent = "Your code is no longer valid."; }
}, RECHECK_MS);
const saved = localStorage.getItem("vr_code");
if(saved) enter(saved);

/* ============ MENU ============ */
function buildMenu(){
  $("themes").innerHTML = "";
  for(const [k,t] of Object.entries(THEMES)){
    const b = document.createElement("button");
    b.textContent = t.label + (t.soon ? " (coming soon)" : "");
    b.disabled = !!t.soon;
    b.onclick = () => openRace(k);
    $("themes").appendChild(b);
  }
}

/* ============ RACE ENGINE ============ */
const cv = $("cv"); let ctx = cv.getContext("2d"), noLabel = false;
const W = 1600, H = 800, TOP = 100, LANE = 104, TRACK_LEN = 13000, START_X = 200;   // logical size; canvas is rendered at screen resolution
let lastT = 0, snow = [], endT = 0, leadPx = 0, gapScale = 1, OBS = [], refuser = null, sinker = null;
// Chance (0 to 1) that each mishap happens in a race. They are rolled separately, so a race can have both, one, or neither.
const CHANCE = { refuse: 0.35, sink: 0.35 };
const RACE_M = 1000, SIGNS = [800,600,400,200,100];   // trackside "metres to go" signs
const GAP = 650;                              // max on-screen distance behind the leader
function sx(w){ const lw = START_X+leadPx, d = lw-w; return lw - camX - (d > 0 ? d*gapScale : d); }   // gently squeezes the field only if the pack spreads too wide
let theme, field = [], racing = false, t0 = 0, camX = 0, finished = [];

function openRace(key){ theme = THEMES[key]; raceNo = 1; $("start").style.display = ""; $("start").textContent = "Start race 1 of " + EVENT_RACES; setTitle(); $("res").textContent = ""; setup(); show("race"); fit(); draw(0); }
$("back").onclick = () => { racing = false; show("menu"); };
$("start").onclick = () => { if(!racing) run(); };

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function setup(){
  // New race: shuffle who's favourite, then lane 0 = 1/1 ... lane 5 = 10/1
  field = shuffle([...theme.runners]).map((r,i) => ({...r, odds:ODDS[i], lane:i, pos:0, ph:Math.random()*6, over:0, mv:false, seed:Math.random()*6}));
  finished = []; camX = 0; snow = []; leadPx = 0;
}

// Draw finishing order using win-probability weights (1/(odds+1)), so 1/1 wins ~half the time, 10/1 ~1 in 11.
function drawOrder(){
  const pool = field.map(f => ({f, w:1/(f.odds+1)})), order = [];
  while(pool.length){
    const tot = pool.reduce((s,p) => s+p.w, 0); let x = Math.random()*tot, k = 0;
    while(k < pool.length-1 && (x -= pool[k].w) > 0) k++;
    order.push(pool.splice(k,1)[0].f);
  }
  return order;
}

function run(){
  $("start").style.display = "none"; setTitle();
  setup(); $("res").textContent = "";
  OBS = [[.14,"jump"],[.27,"water"],[.40,"jump"],[.52,"water"],[.64,"jump"],[.76,"water"],[.88,"jump"]]
    .map(([fr,k]) => ({k, x:START_X+TRACK_LEN*fr, hw:k === "water" ? 150 : 95, H:k === "water" ? 58 : 46}));
  const jumps = OBS.filter(o => o.k === "jump"), waters = OBS.filter(o => o.k === "water"), pool = [...field], pick = a => a[Math.random()*a.length|0];
  refuser = sinker = null;
  if(Math.random() < CHANCE.refuse){ refuser = pool.splice(Math.random()*pool.length|0,1)[0]; const o = pick(jumps); refuser.victim = 1; refuser.stopP = (o.x-o.hw-20-START_X)/TRACK_LEN; }
  if(Math.random() < CHANCE.sink){ sinker = pool.splice(Math.random()*pool.length|0,1)[0]; const o = pick(waters); sinker.victim = 2; sinker.fallP = (o.x-o.hw-START_X)/TRACK_LEN; }
  const base = 42, order = drawOrder().filter(f => !f.victim);       // the two unlucky runners never finish
  order.forEach((f,i) => { f.T = base + i*0.9 + Math.random()*0.4; f.omax = 170 - i*28; });
  field.forEach(f => {
    if(f.victim){ f.T = base + 3 + Math.random()*3; f.omax = 0; }
    f.a = [0.018+Math.random()*0.01, 0.012+Math.random()*0.01];   // gentle wobble: speed never drops to zero
    f.p = [Math.random()*6.3, Math.random()*6.3]; f.last = 0;
  });
  endT = Math.max(...order.map(f => f.T)) + 1.5; lastT = 0; gapScale = 1;
  racing = true; t0 = performance.now(); $("start").disabled = true;
  requestAnimationFrame(tick);
}

function progress(f, t){                           // smooth wobble that always ends exactly at 1
  const u = Math.min(t/f.T, 1), env = u*(1-u);
  const v = u + env*(f.a[0]*Math.sin(2*Math.PI*1.3*u+f.p[0]) + f.a[1]*Math.sin(2*Math.PI*2.3*u+f.p[1]))*4;
  return Math.max(f.last, Math.min(v, 1));
}

function mishaps(){
  const m = [];
  if(refuser) m.push(`🛑 ${refuser.n} refused at the ${theme.jumpName}`);
  if(sinker) m.push(`💧 ${sinker.n} fell in the ${theme.waterName} and sank`);
  return m.join("   ·   ");
}
function splash(f){
  const x = sx(START_X+f.pos*TRACK_LEN+f.over), y = TOP+f.lane*LANE+LANE/2-12+44;
  for(let i=0;i<30;i++) snow.push({x, y, vx:(Math.random()-.5)*240, vy:-120-Math.random()*200, l:.9, r:2+Math.random()*3.5, c:"#d4f1ff", s:"rgba(80,150,200,.9)"});
}
function tick(now){
  if(!racing) return;
  const t = (now - t0)/1000, dt = Math.max(0, Math.min(t - lastT, .05)); lastT = t;
  field.forEach(f => {
    const old = f.pos*TRACK_LEN;
    let p = progress(f, t);
    if(f.stopP !== undefined){ const k = 300; p = -Math.log(Math.exp(-k*p)+Math.exp(-k*f.stopP))/k; }   // refuser eases to a halt at its obstacle
    if(f.fallP !== undefined && f.fellT === undefined && p >= f.fallP) f.fellT = t;
    if(f.fellT !== undefined) p = f.fallP;
    f.last = f.pos = p;
    f.spd = dt > 0 ? (p*TRACK_LEN - old)/dt : 999;
    if(f.pos >= 1 && !f.done){ f.done = true; finished.push(f); }
    if(f.fellT !== undefined){                                                   // the sinker: short leap, splash, sinks
      const e = t - f.fellT; f.fe = e; f.over = 60*(1 - Math.exp(-e*3)); f.mv = false;
      f.jy = e < .5 ? 46*Math.sin(Math.PI*e/.5) : -(e-.5)*70; f.gone = e > 2.4;
      f.note = e > .5 && e < 2.8 ? "SPLASH!" : "";
      if(e > .5 && !f.splashed){ f.splashed = true; splash(f); }
    } else {
      f.over = f.victim ? 0 : (t > f.T ? f.omax*(1 - Math.exp(-(t - f.T)*1.8)) : 0);   // coast past the line
      if(f.stopP !== undefined && !f.stopped && f.pos > f.stopP-.02 && f.spd < 35) f.stopped = true;
      f.mv = f.victim ? !f.stopped : t < f.T + 1.3;
      const wx = START_X + f.pos*TRACK_LEN; f.jy = 0;
      for(const o of OBS){ const d = wx - o.x; if(Math.abs(d) < o.hw) f.jy = Math.max(f.jy, o.H*(1-(d/o.hw)**2)); }   // jump arc over every obstacle
      f.note = f.stopped ? "REFUSED!" : "";
    }
    f.air = f.jy !== 0;
    if(f.mv){ if(f.jy > 2) f.ph = Math.PI/2;                                      // legs stretched out mid-air
      else f.ph += dt*12*(f.victim ? Math.min(1, f.spd/160) : (t < f.T ? 1 : Math.max(0, 1 - (t - f.T)/1.3))); }
  });
  leadPx = Math.max(...field.map(f => f.pos*TRACK_LEN + f.over));
  const act = field.filter(f => !f.stopped && !f.gone && f.fellT === undefined), minAct = Math.min(...act.map(f => f.pos*TRACK_LEN + f.over));
  gapScale += (Math.min(1, GAP/Math.max(1, leadPx - minAct)) - gapScale)*Math.min(1, dt*4);
  const prev = camX;
  camX = Math.max(0, Math.min(leadPx - W*0.64, TRACK_LEN + START_X + 260 - W));
  snow.forEach(p => { p.x += p.vx*dt - (camX - prev); p.y += p.vy*dt; p.vy += (p.g === undefined ? 140 : p.g)*dt; p.l -= dt; });
  field.forEach(f => {
    const py = TOP+f.lane*LANE+LANE/2-12;
    if(f.mv && !f.air && f.k !== "ghost" && Math.random() < dt*30)
      snow.push({x:sx(START_X+f.pos*TRACK_LEN+f.over)-20, y:py+38+Math.random()*6, vx:-40-Math.random()*70, vy:-30-Math.random()*60, l:.6, r:2+Math.random()*3});
    if(f.fe > .5 && f.fe < 3 && Math.random() < dt*16)                           // bubbles from the sinker
      snow.push({x:sx(START_X+f.pos*TRACK_LEN+f.over)+(Math.random()-.5)*40, y:py+44, vx:(Math.random()-.5)*20, vy:-40, g:-20, l:.9, r:2+Math.random()*2.5, c:"rgba(215,243,255,.8)", s:"rgba(90,150,200,.9)"});
  });
  snow = snow.filter(p => p.l > 0);
  draw(t);
  if(t < endT) return requestAnimationFrame(tick);
  racing = false; $("start").disabled = false;
  const w = finished[0]; setTimeout(showFinish, 900);
  $("res").textContent = `🏆 ${w.n} wins at ${w.odds}/1!  2nd: ${finished[1].n}  3rd: ${finished[2].n}` + (mishaps() ? "   ·   " + mishaps() : "");
}

/* ============ FINISH SCREEN ============ */
function portrait(f){                       // reuse deer() to paint a close-up
  const c = document.createElement("canvas"); c.width = 420; c.height = 430;
  const real = ctx; ctx = c.getContext("2d"); noLabel = true;
  const pg = f.k === "pig", sc = pg ? 2.4 : 2.3; ctx.scale(sc,sc); (theme.runner || deer)({...f,mv:false,ph:0}, pg ? 69 : f.k ? 91 : 76, pg ? 88 : f.k ? 101 : 112, 0);
  ctx = real; noLabel = false; return c;
}
function showFinish(){
